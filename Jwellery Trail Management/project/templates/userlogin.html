{% extends 'base.html' %}
{% block content %}
<style>
  .auth-wrap {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf6f0;
    padding: 40px 20px;
  }
  .auth-box {
    background: white;
    border: 1px solid rgba(201,168,76,0.2);
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    position: relative;
  }
  .auth-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #C9A84C, transparent);
  }
  .auth-title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 400;
    color: #2c2416;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 8px;
  }
  .auth-sub {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: #7a6e60;
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 32px;
  }
  .auth-field {
    margin-bottom: 18px;
  }
  .auth-field label {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #C9A84C;
    margin-bottom: 6px;
  }
  .auth-field input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid rgba(201,168,76,0.25);
    background: #faf6f0;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    color: #2c2416;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .auth-field input:focus { border-color: #C9A84C; }
  .auth-error {
    background: rgba(220,53,69,0.08);
    border: 1px solid rgba(220,53,69,0.3);
    color: #dc3545;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    padding: 10px 14px;
    margin-bottom: 18px;
    text-align: center;
  }
  .btn-auth {
    width: 100%;
    padding: 13px;
    background: #2c2416;
    color: #C9A84C;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-auth:hover { background: #B8860B; color: white; }
  .auth-link {
    text-align: center;
    margin-top: 20px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: #7a6e60;
  }
  .auth-link a { color: #C9A84C; text-decoration: none; }
</style>

<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-title">Welcome Back</div>
    <div class="auth-sub">Sign in to your Tanishq account</div>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <div class="auth-field">
        <label>Username</label>
        <input type="text" name="username" required/>
      </div>
      <div class="auth-field">
        <label>Password</label>
        <input type="password" name="password" required/>
      </div>
      <button type="submit" class="btn-auth">✦ &nbsp;Login</button>
    </form>
    <div class="auth-link">Don't have an account? <a href="{% url 'register' %}">Register</a></div>
  </div>
</div>
{% endblock %}
