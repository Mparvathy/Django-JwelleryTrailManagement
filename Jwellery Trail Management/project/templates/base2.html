{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Tanishq</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: #f5f5f5;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 60px;
    background: #000;
    height: 70px;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,215,0,0.1);
}

.logo a {
    font-family: 'Cinzel', serif;
    font-size: 30px;
    font-weight: 700;
    color: #FFD700;
    text-decoration: none;
    letter-spacing: 3px;
    font-style: italic;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 0;
    margin: 0;
    padding: 0;
    align-items: center;
    height: 100%;
}

.nav-links li { position: relative; height: 100%; display: flex; align-items: center; }

.nav-links li a {
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    color: rgba(255,255,255,0.85);
    padding: 0 20px;
    height: 100%;
    display: flex;
    align-items: center;
    position: relative;
    transition: color 0.25s;
    letter-spacing: 0.3px;
}

.nav-links li a::after {
    content: "";
    position: absolute;
    width: 0%;
    height: 2px;
    left: 20px;
    bottom: 0;
    background: #FFD700;
    transition: width 0.3s ease;
}

.nav-links li a:hover { color: #FFD700; }
.nav-links li a:hover::after { width: calc(100% - 40px); }

.nav-links li a .ripple-wrap {
    position: absolute;
    inset: -10px;
    pointer-events: none;
    overflow: hidden;
    border-radius: 6px;
}

.ripple {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,0.55) 0%, rgba(255,215,0,0) 70%);
    transform: scale(0);
    animation: rippleOut 0.65s ease-out forwards;
    pointer-events: none;
}

@keyframes rippleOut {
    0%   { transform: scale(0); opacity: 1; }
    60%  { transform: scale(3.5); opacity: 0.5; }
    100% { transform: scale(5); opacity: 0; }
}

.nav-links li a.clicked { animation: linkFlash 0.4s ease forwards; }

@keyframes linkFlash {
    0%   { color: white; text-shadow: none; }
    30%  { color: #FFD700; text-shadow: 0 0 12px rgba(255,215,0,0.9); }
    100% { color: #FFD700; text-shadow: none; }
}

.spark {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #FFD700;
    pointer-events: none;
    animation: sparkFly 0.6s ease-out forwards;
}
@keyframes sparkFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx),var(--ty)) scale(0); opacity: 0; }
}

/* ── User greeting ── */
.nav-user {
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    color: rgba(255,215,0,0.75);
    letter-spacing: 0.5px;
    padding: 0 20px 0 0;
    white-space: nowrap;
    border-right: 1px solid rgba(255,215,0,0.15);
    margin-right: 8px;
    height: auto;
}

/* ── Cart Button ── */
.btn-cart {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 24px;
    height: 70px;

    color: #1a1400;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.25s;
    margin-left: 16px;
}

.btn-cart::after { display: none; }
.btn-cart .cart-count {
    background: #000;
    color: #FFD700;
    font-size: 10px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* ── Page Loader ── */
#page-loader {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(3px);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
}
#page-loader.active { opacity: 1; pointer-events: all; }

.diamond-wrap {
    position: relative;
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.d-glow {
    position: absolute;
    inset: 15px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,0.22) 0%, transparent 70%);
    animation: glowBreath 1.2s ease-in-out infinite;
}
@keyframes glowBreath {
    0%, 100% { transform: scale(0.8); opacity: 0.5; }
    50%       { transform: scale(1.6); opacity: 1; }
}
.d-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid transparent;
    border-top-color: rgba(255,215,0,0.6);
    border-bottom-color: rgba(255,215,0,0.6);
    animation: dRingSpin 2s linear infinite;
}
.d-ring2 {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 1px solid transparent;
    border-left-color: rgba(255,215,0,0.35);
    border-right-color: rgba(255,215,0,0.35);
    animation: dRingSpin 1.4s linear infinite reverse;
}
@keyframes dRingSpin { to { transform: rotate(360deg); } }
.d-symbol {
    font-size: 42px;
    color: #FFD700;
    line-height: 1;
    position: relative;
    z-index: 2;
    animation: diamondPulse 1.2s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(255,215,0,0.9), 0 0 28px rgba(255,215,0,0.6), 0 0 50px rgba(255,215,0,0.3);
}
@keyframes diamondPulse {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50%       { transform: scale(1.25) rotate(45deg); opacity: 0.75; }
}
.d-spark {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #FFD700;
    animation: sparkTwinkle 1.6s ease-in-out infinite;
}
.ds1 { top: 4px;    left: 50%; margin-left: -2px; animation-delay: 0s; }
.ds2 { top: 50%;   right: 4px; margin-top:  -2px; animation-delay: 0.4s; }
.ds3 { bottom: 4px; left: 50%; margin-left: -2px; animation-delay: 0.8s; }
.ds4 { top: 50%;    left: 4px; margin-top:  -2px; animation-delay: 1.2s; }
@keyframes sparkTwinkle {
    0%, 100% { transform: scale(0); opacity: 0; }
    50%       { transform: scale(1); opacity: 1; }
}
.d-text {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,215,0,0.7);
    animation: textFade 1.2s ease-in-out infinite;
}
@keyframes textFade {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
}

@media (max-width: 768px) {
    .navbar { padding: 0 20px; height: auto; flex-wrap: wrap; padding: 14px 20px; }
    .nav-links { flex-wrap: wrap; gap: 0; height: auto; margin-top: 10px; width: 100%; }
    .nav-links li { height: auto; }
    .nav-links li a { padding: 10px 14px; height: auto; }
    .btn-cart { height: auto; padding: 10px 18px; margin-left: 0; }
    .nav-user { border-right: none; padding: 10px 0; }
}
</style>

<body>

<div id="page-loader">
    <div class="diamond-wrap">
        <div class="d-glow"></div>
        <div class="d-ring"></div>
        <div class="d-ring2"></div>
        <span class="d-symbol">✦</span>
        <span class="d-spark ds1"></span>
        <span class="d-spark ds2"></span>
        <span class="d-spark ds3"></span>
        <span class="d-spark ds4"></span>
    </div>
    <div class="d-text">Loading</div>
</div>

<nav class="navbar">
    <div class="logo">
        <a href="{% url 'userdashboard'%}">Tanishq</a>
    </div>
    <ul class="nav-links">
        <li class="nav-user">Hi, {{ request.user.username }} ✦</li>
        <li><a href="{% url 'menu' %}">Menu<span class="ripple-wrap"></span></a></li>
        <li><a href="{% url 'tryon' %}">Try On<span class="ripple-wrap"></span></a></li>
        <li><a href="">Orders<span class="ripple-wrap"></span></a></li>
        <li><a href="">Wishlist<span class="ripple-wrap"></span></a></li>
        <li><a href="{% url 'userlogout' %}">Logout<span class="ripple-wrap"></span></a></li>
        <li>
            <a href="{% url 'cart' %}" class="btn-cart">
                🛒({{ cart_count }})
            </a>
        </li>
    </ul>
</nav>

{% block content %}
{% endblock %}

<script>
var loader = document.getElementById('page-loader');

document.querySelectorAll('.nav-links li a:not(.btn-cart)').forEach(function(link) {
    link.addEventListener('click', function(e) {
        var href = this.getAttribute('href');
        if (href && href !== '' && href !== '#') {
            e.preventDefault();
            loader.classList.add('active');
            var target = href;
            setTimeout(function() { window.location.href = target; }, 1500);
        }

        var wrap = this.querySelector('.ripple-wrap');
        if (wrap) {
            var ripple = document.createElement('span');
            ripple.classList.add('ripple');
            var rect = wrap.getBoundingClientRect();
            var size = Math.max(rect.width, rect.height) * 1.5;
            var x = e.clientX - rect.left - size / 2;
            var y = e.clientY - rect.top  - size / 2;
            ripple.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + x + 'px;top:' + y + 'px;';
            wrap.appendChild(ripple);
            ripple.addEventListener('animationend', function() { ripple.remove(); });
        }

        this.classList.remove('clicked');
        void this.offsetWidth;
        this.classList.add('clicked');
        var self = this;
        this.addEventListener('animationend', function() { self.classList.remove('clicked'); }, { once: true });

        var linkRect = this.getBoundingClientRect();
        var cx = e.clientX - linkRect.left;
        var cy = e.clientY - linkRect.top;
        for (var i = 0; i < 7; i++) {
            var spark = document.createElement('span');
            spark.classList.add('spark');
            var angle = (i / 7) * 360;
            var dist  = 28 + Math.random() * 22;
            var rad   = (angle * Math.PI) / 180;
            spark.style.cssText = 'left:' + cx + 'px; top:' + cy + 'px; --tx:' + (Math.cos(rad)*dist) + 'px; --ty:' + (Math.sin(rad)*dist) + 'px; animation-delay:' + (Math.random()*0.08) + 's;';
            this.appendChild(spark);
            spark.addEventListener('animationend', function() { spark.remove(); });
        }
    });
});

window.addEventListener('pageshow', function() { loader.classList.remove('active'); });
document.addEventListener('DOMContentLoaded', function() { loader.classList.remove('active'); });
</script>

</body>
</html>
