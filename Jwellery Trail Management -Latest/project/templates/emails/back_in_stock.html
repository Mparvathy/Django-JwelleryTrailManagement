<!DOCTYPE html>
<html>
<head>
    <style>
        .email-container {
            font-family: 'Poppins', Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #eee;
            padding: 20px;
        }
        .header {
            background-color: #000;
            color: #FFD700;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            letter-spacing: 5px;
        }
        .content {
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .product-box {
            display: flex;
            align-items: center;
            background-color: #f9f9f9;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #FFD700;
        }
        .btn {
            display: inline-block;
            background-color: #FFD700;
            color: #000;
            padding: 12px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">TANISHQ</div>
        <div class="content">
            <h3>Hello {{ user.first_name|default:user.username }},</h3>
            <p>Great news! A piece you loved is back in stock.</p>
            
            <div class="product-box">
                <div>
                    <p><strong>{{ product.name }}</strong></p>
                    <p>Price: ₹{{ product.price }}</p>
                    <p style="color: #28a745;">Status: In Stock</p>
                </div>
            </div>

            <p>Don't wait too long—our most popular pieces tend to disappear quickly!</p>
            
            <a href="http://127.0.0.1:8000/menu/" class="btn">Shop Now</a>
            
            <p>Warm regards,<br>The Tanishq Team</p>
        </div>
    </div>
</body>
</html>
